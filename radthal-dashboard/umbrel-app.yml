description: >-
  Vue d'ensemble de la chaine Radthal : blocs, difficulte, puissance du reseau, solde du portefeuille, mempool et mineurs ckpool.
releaseNotes: >-
  L'explorateur de blocs n'affiche plus de texte illisible : les donnees binaires sont montrees en hexadecimal, et l'etiquette du mineur ne garde que le texte lisible. Le logo Radthal (la piece R) remplace le petit logo en haut a gauche de la page et dans l'onglet du navigateur. Rien d'autre ne change. Les pages se rechargent maintenant toutes seules apres une mise a jour : plus besoin d'actualiser a la main.
