version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: radthal-node_web_1
      APP_PORT: 3777

  # Le noeud Radthal lui-meme (bitcoind). Meme image, meme programme et memes
  # donnees que l'ancien conteneur lance a la main : rien n'est copie ni perdu.
  # Umbrel telecharge toujours les images : celle-ci vient du petit registre
  # local (conteneur radthal-registry, port 5000 de ce Pi uniquement).
  daemon:
    image: localhost:5000/radthal-build:v1
    restart: on-failure
    network_mode: host
    # bitcoind a besoin de temps pour sauvegarder son etat a l'arret
    stop_grace_period: 2m
    # -maxtipage : sans lui, apres plus de 24 h sans nouveau bloc (coupure de courant, mineurs eteints) le noeud se croit
    # "en synchronisation initiale" et refuse de donner du travail aux mineurs. Ici il ne se croit jamais en retard.
    # -minimumchainwork : un nouveau noeud reste "en synchronisation" tant qu'il n'a pas rattrape ce niveau de travail
    # cumule (valeur d'un bloc ~1 000 blocs sous la tete, relevee sur le tableau de bord le 25/10/2026).
    command: ["/build/bin/bitcoind", "-datadir=/data", "-printtoconsole", "-maxtipage=315360000",
              "-minimumchainwork=000000000000000000000000000000000000000000000000278424e424e42244"]
    # Une seule zone de memoire (glibc) : sans ca, chaque grosse lecture (analyse des branches du Tableau de bord)
    # laisse des centaines de Mo "libres mais gardes" dans une zone differente, et le noeud gonfle sans fin.
    # Teste : meme nombre de branches, memoire stable apres 16 analyses de suite au lieu de +5 Go.
    environment:
      MALLOC_ARENA_MAX: "1"
    volumes:
      - /home/umbrel/radthal/build:/build:ro
      - /home/umbrel/radthal-data:/data

  web:
    image: python:3.12-alpine
    restart: on-failure
    stop_grace_period: 5s
    extra_hosts:
      - "radthal-host:host-gateway"
    command: ["python", "/app/radthal_ui.py"]
    volumes:
      - ${APP_DATA_DIR}/radthal_ui.py:/app/radthal_ui.py:ro
      - /home/umbrel/radthal/rpcpass.txt:/run/secrets/radthal_rpc_password:ro

    environment:
      VIEW: node
      PORT: "3777"
      RPC: "http://radthal-host:9332"
      PASSFILE: /run/secrets/radthal_rpc_password
      LOGS: /ckpool/logs
      WALLET: minage
      STRATUM_PORT: "3333"
