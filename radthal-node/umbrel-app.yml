id: radthal-node
category: bitcoin
name: Radthal Node
version: "1.2.7"
tagline: Noeud complet Radthal
description: >-
  Le noeud Radthal (bitcoind) gere depuis Umbrel, avec une page d'etat : blocs, difficulte, pairs connectes, ports. Arreter l'app arrete le noeud.
releaseNotes: >-
  Un nouveau noeud reste maintenant en synchronisation tant qu'il n'a pas rattrape la chaine, meme avec le reglage qui lui permet de redemarrer apres une longue coupure. Rien d'autre ne change. Le noeud redemarre une fois pendant la mise a jour (environ 2 minutes).
