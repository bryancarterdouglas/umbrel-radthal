manifestVersion: 1.1
id: radthal-node
category: bitcoin
name: Radthal Node
version: "1.2.6"
tagline: Noeud complet Radthal
description: >-
  Le noeud Radthal (bitcoind) gere depuis Umbrel, avec une page d'etat : blocs, difficulte, pairs connectes, ports. Arreter l'app arrete le noeud.
releaseNotes: >-
  Le noeud peut maintenant redemarrer apres plus de 24 heures sans nouveau bloc (coupure de courant, mineurs eteints) sans refuser de donner du travail aux mineurs : plus besoin de modifier bitcoin.conf a la main. Rien d'autre ne change. Le noeud redemarre une fois pendant la mise a jour (environ 2 minutes).
